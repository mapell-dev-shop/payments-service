[project]
name = "payments-service"
version = "0.1.0"
description = "Payments bounded context of the shop: captures payments through a fake gateway."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "shop-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8", "types-jsonschema>=4.23", "httpx2>=2.13"]

[tool.uv.sources]
shop-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
